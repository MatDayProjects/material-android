name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: Build and validate unsigned release APK and AAB artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Release work is not cancelled by a later push. A partially cancelled release can leave
# an immutable tag without its corresponding evidence.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-runtime:
    name: Build QEMU runtime (${{ matrix.abi }})
    if: >-
      github.event_name == 'push' ||
      inputs.release == true
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
          - abi: x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Bootstrap native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils jq
          command -v bash
          command -v curl
          command -v docker
          command -v git
          command -v jq
          command -v readelf
          command -v sha256sum

      - name: Verify the source and patch manifest
        shell: bash
        run: bash native/qemu/build-android.sh --verify-only

      - name: Build and collect the Android runtime
        shell: bash
        run: |
          set -euo pipefail
          bash native/qemu/build-android.sh \
            --host-abi "${{ matrix.abi }}" \
            --output "${RUNNER_TEMP}/openvm-qemu/${{ matrix.abi }}"
          mkdir -p native/qemu/dist
          cp -a "${RUNNER_TEMP}/openvm-qemu/${{ matrix.abi }}" native/qemu/dist/
          test -s "native/qemu/dist/${{ matrix.abi }}/libopenvm-qemu-aarch64.so"
          test -s "native/qemu/dist/${{ matrix.abi }}/libopenvm-qemu-x86_64.so"
          test -d "native/qemu/dist/${{ matrix.abi }}/share/qemu"
          jq empty "native/qemu/dist/${{ matrix.abi }}/runtime.json"
          jq empty "native/qemu/dist/${{ matrix.abi }}/build-provenance.json"
          jq -e --slurpfile manifest native/qemu/qemu-build.json '
            (.qemuDataBytes | (type == "number" and . <= 67108864)) and
            (.qemuDataFileCount | (type == "number" and . > 0)) and
            (.hasQemuDataDirectory == true) and
            (.qemuDataPolicy == "allowlist") and
            (.qemuDataFiles == $manifest[0].packaging.qemuDataFiles)
          ' "native/qemu/dist/${{ matrix.abi }}/runtime.json"

      - name: Upload native runtime evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-qemu-runtime-${{ matrix.abi }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: native/qemu/dist
          if-no-files-found: warn
          retention-days: 14

  debug-build:
    name: Validate debug APK before release
    if: >-
      github.event_name == 'push' ||
      inputs.release == true
    needs: native-runtime
    runs-on: ubuntu-24.04
    env:
      OPENVM_QEMU_RUNTIME_DIR: ${{ github.workspace }}/native/qemu/runtime

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Put Android build-tools on PATH
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "$sdk_root" ]] || { echo "Android SDK root was not provided by setup-android." >&2; exit 1; }
          build_tools="$sdk_root/build-tools/35.0.0"
          [[ -x "$build_tools/zipalign" ]] || { echo "zipalign is missing from $build_tools" >&2; exit 1; }
          export PATH="$build_tools:$PATH"
          command -v zipalign
          echo "$build_tools" >> "$GITHUB_PATH"

      - name: Download both native runtime ABIs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # A failed-job rerun reuses artifacts from the successful attempt.
          # Match the immutable run id and commit while allowing any attempt number.
          pattern: android-release-qemu-runtime-*-${{ github.run_id }}-*-${{ github.sha }}
          path: native/qemu/runtime
          merge-multiple: true

      - name: Validate packaged runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s native/qemu/runtime/arm64-v8a/libopenvm-qemu-aarch64.so
          test -s native/qemu/runtime/arm64-v8a/libopenvm-qemu-x86_64.so
          test -s native/qemu/runtime/x86_64/libopenvm-qemu-aarch64.so
          test -s native/qemu/runtime/x86_64/libopenvm-qemu-x86_64.so
          test -s native/qemu/runtime/arm64-v8a/lib/libz.so.1
          test -s native/qemu/runtime/x86_64/lib/libz.so.1
          test -d native/qemu/runtime/arm64-v8a/share/qemu
          test -d native/qemu/runtime/x86_64/share/qemu

      - name: Build and verify debug APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          ./gradlew --no-daemon --no-scan --stacktrace \
            testDebugUnitTest assembleDebug

          mapfile -d '' debug_apks < <(
            find . -type f -path '*/build/outputs/apk/debug/*.apk' -print0
          )
          if (( ${#debug_apks[@]} == 0 )); then
            echo "Gradle completed without producing a debug APK." >&2
            exit 1
          fi

          for apk in "${debug_apks[@]}"; do
            unzip -l "$apk" | grep -F 'lib/x86_64/libopenvm-qemu-aarch64.so'
            unzip -l "$apk" | grep -F 'lib/x86_64/libopenvm-qemu-x86_64.so'
            unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopenvm-qemu-aarch64.so'
            unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopenvm-qemu-x86_64.so'
            unzip -l "$apk" | grep -F 'assets/native-qemu/x86_64/lib/libz.so.1'
            unzip -l "$apk" | grep -F 'assets/native-qemu/arm64-v8a/lib/libz.so.1'
            unzip -l "$apk" | grep -F 'assets/native-qemu/x86_64/share/qemu/'
            unzip -l "$apk" | grep -F 'assets/native-qemu/arm64-v8a/share/qemu/'
            zipalign -c -P 16 4 "$apk"
            echo "Verified unsigned debug APK: ${apk#./}"
          done

      - name: Upload safe pre-release evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-debug-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/test-results/**/*.xml
            **/build/reports/tests/**/*.html
            **/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14

  unsigned-release:
    name: Build and verify unsigned release artifacts
    needs: [debug-build, native-runtime]
    if: >-
      needs.debug-build.result == 'success' &&
      (github.event_name == 'push' || inputs.release == true)
    runs-on: ubuntu-24.04
    env:
      OPENVM_QEMU_RUNTIME_DIR: ${{ github.workspace }}/native/qemu/runtime
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Put Android build-tools on PATH
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "$sdk_root" ]] || { echo "Android SDK root was not provided by setup-android." >&2; exit 1; }
          build_tools="$sdk_root/build-tools/35.0.0"
          [[ -x "$build_tools/zipalign" ]] || { echo "zipalign is missing from $build_tools" >&2; exit 1; }
          export PATH="$build_tools:$PATH"
          command -v zipalign
          echo "$build_tools" >> "$GITHUB_PATH"

      - name: Download both native runtime ABIs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # A failed-job rerun reuses artifacts from the successful attempt.
          # Match the immutable run id and commit while allowing any attempt number.
          pattern: android-release-qemu-runtime-*-${{ github.run_id }}-*-${{ github.sha }}
          path: native/qemu/runtime
          merge-multiple: true

      - name: Validate packaged runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s native/qemu/runtime/arm64-v8a/libopenvm-qemu-aarch64.so
          test -s native/qemu/runtime/arm64-v8a/libopenvm-qemu-x86_64.so
          test -s native/qemu/runtime/x86_64/libopenvm-qemu-aarch64.so
          test -s native/qemu/runtime/x86_64/libopenvm-qemu-x86_64.so
          test -s native/qemu/runtime/arm64-v8a/lib/libz.so.1
          test -s native/qemu/runtime/x86_64/lib/libz.so.1
          test -d native/qemu/runtime/arm64-v8a/share/qemu
          test -d native/qemu/runtime/x86_64/share/qemu

      - name: Build and verify unsigned APK and AAB
        id: release
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/android-release-artifacts"
          mkdir -p "$artifact_dir"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

          chmod +x ./gradlew
          ./gradlew --no-daemon --no-scan --stacktrace \
            assembleRelease bundleRelease

          mapfile -d '' unsigned_release_apks < <(
            find . -type f -path '*/build/outputs/apk/release/*.apk' \
              -name '*unsigned*.apk' -print0
          )
          if (( ${#unsigned_release_apks[@]} != 0 )); then
            release_apks=("${unsigned_release_apks[@]}")
          else
            mapfile -d '' release_apks < <(
              find . -type f -path '*/build/outputs/apk/release/*.apk' \
                ! -name '*unaligned*.apk' -print0
            )
          fi
          mapfile -d '' release_aabs < <(
            find . -type f -path '*/build/outputs/bundle/release/*.aab' -print0
          )
          if (( ${#release_apks[@]} == 0 )); then
            echo "Gradle completed without producing a release APK." >&2
            exit 1
          fi
          if (( ${#release_aabs[@]} == 0 )); then
            echo "Gradle completed without producing a release AAB." >&2
            exit 1
          fi

          for apk in "${release_apks[@]}"; do
            unzip -l "$apk" | grep -F 'lib/x86_64/libopenvm-qemu-aarch64.so'
            unzip -l "$apk" | grep -F 'lib/x86_64/libopenvm-qemu-x86_64.so'
            unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopenvm-qemu-aarch64.so'
            unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopenvm-qemu-x86_64.so'
            unzip -l "$apk" | grep -F 'assets/native-qemu/x86_64/lib/libz.so.1'
            unzip -l "$apk" | grep -F 'assets/native-qemu/arm64-v8a/lib/libz.so.1'
            unzip -l "$apk" | grep -F 'assets/native-qemu/x86_64/share/qemu/'
            unzip -l "$apk" | grep -F 'assets/native-qemu/arm64-v8a/share/qemu/'
            zipalign -c -P 16 4 "$apk"
          done
          for aab in "${release_aabs[@]}"; do
            unzip -l "$aab" | grep -F 'base/lib/x86_64/libopenvm-qemu-aarch64.so'
            unzip -l "$aab" | grep -F 'base/lib/x86_64/libopenvm-qemu-x86_64.so'
            unzip -l "$aab" | grep -F 'base/lib/arm64-v8a/libopenvm-qemu-aarch64.so'
            unzip -l "$aab" | grep -F 'base/lib/arm64-v8a/libopenvm-qemu-x86_64.so'
            unzip -l "$aab" | grep -F 'base/assets/native-qemu/x86_64/lib/libz.so.1'
            unzip -l "$aab" | grep -F 'base/assets/native-qemu/arm64-v8a/lib/libz.so.1'
            unzip -l "$aab" | grep -F 'base/assets/native-qemu/x86_64/share/qemu/'
            unzip -l "$aab" | grep -F 'base/assets/native-qemu/arm64-v8a/share/qemu/'
          done

          verification_file="$artifact_dir/verification.txt"
          : > "$verification_file"

          for apk in "${release_apks[@]}"; do
            artifact_name="$(basename "$apk")"
            destination="$artifact_dir/$artifact_name"
            if [[ -e "$destination" ]]; then
              echo "Release artifact name collision: $artifact_name" >&2
              exit 1
            fi
            if unzip -l "$apk" | grep -Eq 'META-INF/[^ ]+\.(RSA|DSA|EC|SF)$'; then
              echo "Release APK unexpectedly contains signing metadata: $artifact_name" >&2
              exit 1
            fi
            cp -- "$apk" "$destination"
            printf 'Unsigned APK verified: %s\n' "$artifact_name" >> "$verification_file"
          done

          for aab in "${release_aabs[@]}"; do
            artifact_name="$(basename "$aab")"
            destination="$artifact_dir/$artifact_name"
            if [[ -e "$destination" ]]; then
              echo "Release artifact name collision: $artifact_name" >&2
              exit 1
            fi
            if unzip -l "$aab" | grep -Eq 'META-INF/[^ ]+\.(RSA|DSA|EC|SF)$'; then
              echo "Release AAB unexpectedly contains signing metadata: $artifact_name" >&2
              exit 1
            fi
            cp -- "$aab" "$destination"
            printf 'Unsigned AAB verified: %s\n' "$artifact_name" >> "$verification_file"
          done

          (
            cd "$artifact_dir"
            sha256sum -- *.apk *.aab > SHA256SUMS.txt
          )

      - name: Upload safe unsigned release evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ steps.release.outputs.artifact_dir }}
          if-no-files-found: warn
          retention-days: 30

  release-not-requested:
    name: Release not requested
    if: github.event_name == 'workflow_dispatch' && inputs.release != true
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the no-op dispatch
        run: echo "No release was requested. Dispatch again with release=true to build unsigned artifacts."
