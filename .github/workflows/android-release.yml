name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: Build and validate unsigned release APK and AAB artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Release work is not cancelled by a later push. A partially cancelled release can leave
# an immutable tag without its corresponding evidence.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-runtime:
    name: Build QEMU runtime (${{ matrix.abi }})
    if: >-
      github.event_name == 'push' ||
      inputs.release == true
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
          - abi: x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Bootstrap native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils jq
          command -v bash
          command -v curl
          command -v docker
          command -v git
          command -v jq
          command -v readelf
          command -v sha256sum

      - name: Verify the source and patch manifest
        shell: bash
        run: bash native/qemu/build-android.sh --verify-only

      - name: Build and collect the Android runtime
        id: runtime_build
        shell: bash
        run: |
          set -euo pipefail
          bash native/qemu/build-android.sh \
            --host-abi "${{ matrix.abi }}" \
            --output "${RUNNER_TEMP}/openvm-qemu/${{ matrix.abi }}"
          mkdir -p native/qemu/dist
          cp -a "${RUNNER_TEMP}/openvm-qemu/${{ matrix.abi }}" native/qemu/dist/
          test -s "native/qemu/dist/${{ matrix.abi }}/libopenvm-qemu-aarch64.so"
          test -s "native/qemu/dist/${{ matrix.abi }}/libopenvm-qemu-x86_64.so"
          test -d "native/qemu/dist/${{ matrix.abi }}/share/qemu"
          jq empty "native/qemu/dist/${{ matrix.abi }}/runtime.json"
          jq empty "native/qemu/dist/${{ matrix.abi }}/build-provenance.json"
          jq -e --slurpfile manifest native/qemu/qemu-build.json '
            (.qemuDataBytes | (type == "number" and . <= 67108864)) and
            (.qemuDataFileCount | (type == "number" and . > 0)) and
            (.hasQemuDataDirectory == true) and
            (.qemuDataPolicy == "allowlist") and
            (.qemuDataFiles == $manifest[0].packaging.qemuDataFiles)
          ' "native/qemu/dist/${{ matrix.abi }}/runtime.json"

      - name: Collect runtime job context
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/qemu/dist
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "run_attempt=${GITHUB_RUN_ATTEMPT}" \
            "commit=${GITHUB_SHA}" \
            "job=${GITHUB_JOB}" \
            "abi=${{ matrix.abi }}" \
            "runtime_step_outcome=${{ steps.runtime_build.outcome }}" \
            "runner_os=${RUNNER_OS}" \
            "runner_arch=${RUNNER_ARCH}" \
            "runner_name=${RUNNER_NAME}" \
            > "native/qemu/dist/ci-context-${{ matrix.abi }}.txt"

      - name: Upload native runtime evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-qemu-runtime-${{ matrix.abi }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: native/qemu/dist
          if-no-files-found: warn
          retention-days: 14

  debug-build:
    name: Validate debug APK before release
    if: >-
      github.event_name == 'push' ||
      inputs.release == true
    needs: native-runtime
    runs-on: ubuntu-24.04
    env:
      OPENVM_QEMU_RUNTIME_DIR: ${{ github.workspace }}/native/qemu/runtime

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Put Android build-tools on PATH
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "$sdk_root" ]] || { echo "Android SDK root was not provided by setup-android." >&2; exit 1; }
          build_tools="$sdk_root/build-tools/35.0.0"
          [[ -x "$build_tools/zipalign" ]] || { echo "zipalign is missing from $build_tools" >&2; exit 1; }
          [[ -x "$build_tools/apksigner" ]] || { echo "apksigner is missing from $build_tools" >&2; exit 1; }
          [[ -x "$build_tools/aapt2" ]] || { echo "aapt2 is missing from $build_tools" >&2; exit 1; }
          if ! command -v python3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3
          fi
          export PATH="$build_tools:$PATH"
          command -v zipalign
          command -v apksigner
          command -v aapt2
          command -v python3
          echo "$build_tools" >> "$GITHUB_PATH"

      - name: Download both native runtime ABIs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # A failed-job rerun reuses artifacts from the successful attempt.
          # Match the immutable run id and commit while allowing any attempt number.
          pattern: android-release-qemu-runtime-*-${{ github.run_id }}-*-${{ github.sha }}
          path: native/qemu/runtime
          merge-multiple: true

      - name: Validate packaged runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s native/qemu/runtime/arm64-v8a/libopenvm-qemu-aarch64.so
          test -s native/qemu/runtime/arm64-v8a/libopenvm-qemu-x86_64.so
          test -s native/qemu/runtime/x86_64/libopenvm-qemu-aarch64.so
          test -s native/qemu/runtime/x86_64/libopenvm-qemu-x86_64.so
          test -s native/qemu/runtime/arm64-v8a/lib/libz.so.1
          test -s native/qemu/runtime/x86_64/lib/libz.so.1
          test -d native/qemu/runtime/arm64-v8a/share/qemu
          test -d native/qemu/runtime/x86_64/share/qemu

      - name: Build and verify debug APKs
        id: debug_build
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          chmod +x ./gradlew

          unsigned_root="$RUNNER_TEMP/openvm-unsigned-build"
          export HOME="$unsigned_root/home"
          export ANDROID_USER_HOME="$unsigned_root/android"
          export GRADLE_USER_HOME="$unsigned_root/gradle"
          mkdir -p "$HOME" "$ANDROID_USER_HOME" "$GRADLE_USER_HOME"

          ./gradlew --no-daemon --no-scan --stacktrace clean \
            testDebugUnitTest assembleDebug assembleDebugAndroidTest

          mapfile -d '' app_apks < <(
            find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print0
          )
          mapfile -d '' instrumentation_apks < <(
            find app/build/outputs/apk/androidTest/debug -maxdepth 1 -type f -name '*.apk' -print0
          )
          if (( ${#app_apks[@]} != 1 || ${#instrumentation_apks[@]} != 1 )); then
            echo "Expected exactly one debug app APK and one instrumentation APK." >&2
            exit 1
          fi
          built_apks=("${app_apks[@]}" "${instrumentation_apks[@]}")

          debug_app_apk="${app_apks[0]}"
          unzip -l "$debug_app_apk" | grep -F 'lib/x86_64/libopenvm-qemu-aarch64.so'
          unzip -l "$debug_app_apk" | grep -F 'lib/x86_64/libopenvm-qemu-x86_64.so'
          unzip -l "$debug_app_apk" | grep -F 'lib/arm64-v8a/libopenvm-qemu-aarch64.so'
          unzip -l "$debug_app_apk" | grep -F 'lib/arm64-v8a/libopenvm-qemu-x86_64.so'
          unzip -l "$debug_app_apk" | grep -F 'assets/native-qemu/x86_64/lib/libz.so.1'
          unzip -l "$debug_app_apk" | grep -F 'assets/native-qemu/arm64-v8a/lib/libz.so.1'
          unzip -l "$debug_app_apk" | grep -F 'assets/native-qemu/x86_64/share/qemu/'
          unzip -l "$debug_app_apk" | grep -F 'assets/native-qemu/arm64-v8a/share/qemu/'

          python3 scripts/verify_unsigned_android_artifacts.py \
            --forbid-signing-material-root . \
            --forbid-signing-material-root "$HOME" \
            --forbid-signing-material-root "$ANDROID_USER_HOME" \
            --forbid-signing-material-root "$GRADLE_USER_HOME" \
            app/build/outputs/apk

          for apk in "${built_apks[@]}"; do
            zipalign -c -P 16 4 "$apk"
            aapt2 dump badging "$apk" >/dev/null
            set +e
            verifier_output="$(apksigner verify --verbose "$apk" 2>&1)"
            verifier_status=$?
            set -e
            if (( verifier_status == 0 )); then
              echo "APK unexpectedly verifies as signed: ${apk#./}" >&2
              exit 1
            fi
            if ! grep -Fq 'DOES NOT VERIFY' <<<"$verifier_output"; then
              echo "apksigner failed for an unexpected reason: ${apk#./}" >&2
              printf '%s\n' "$verifier_output" >&2
              exit 1
            fi
            echo "Verified valid unsigned APK: ${apk#./}"
          done

          verified_dir="$RUNNER_TEMP/openvm-verified-release-debug-apks"
          mkdir -p "$verified_dir"
          for apk in "${built_apks[@]}"; do
            artifact_name="$(basename "$apk")"
            [[ ! -e "$verified_dir/$artifact_name" ]] || { echo "Verified APK name collision: $artifact_name" >&2; exit 1; }
            cp -- "$apk" "$verified_dir/$artifact_name"
          done

      - name: Collect safe pre-release evidence
        id: collect_debug
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/android-release-debug-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "run_attempt=${GITHUB_RUN_ATTEMPT}" \
            "commit=${GITHUB_SHA}" \
            "job=${GITHUB_JOB}" \
            "verification_step_outcome=${{ steps.debug_build.outcome }}" \
            "runner_os=${RUNNER_OS}" \
            "runner_arch=${RUNNER_ARCH}" \
            "runner_name=${RUNNER_NAME}" \
            > "$evidence_dir/ci-context.txt"
          if [[ -d "$RUNNER_TEMP/openvm-verified-release-debug-apks" ]]; then
            cp -a "$RUNNER_TEMP/openvm-verified-release-debug-apks/." "$evidence_dir/"
          fi
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Upload safe pre-release evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-debug-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ steps.collect_debug.outputs.evidence_dir }}
            **/build/test-results/**/*.xml
            **/build/reports/tests/**/*.html
            **/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14

  unsigned-release:
    name: Build and verify unsigned release artifacts
    needs: [debug-build, native-runtime]
    if: >-
      needs.debug-build.result == 'success' &&
      (github.event_name == 'push' || inputs.release == true)
    runs-on: ubuntu-24.04
    env:
      OPENVM_QEMU_RUNTIME_DIR: ${{ github.workspace }}/native/qemu/runtime
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Put Android build-tools on PATH
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "$sdk_root" ]] || { echo "Android SDK root was not provided by setup-android." >&2; exit 1; }
          build_tools="$sdk_root/build-tools/35.0.0"
          [[ -x "$build_tools/zipalign" ]] || { echo "zipalign is missing from $build_tools" >&2; exit 1; }
          [[ -x "$build_tools/apksigner" ]] || { echo "apksigner is missing from $build_tools" >&2; exit 1; }
          [[ -x "$build_tools/aapt2" ]] || { echo "aapt2 is missing from $build_tools" >&2; exit 1; }
          if ! command -v python3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3
          fi
          export PATH="$build_tools:$PATH"
          command -v zipalign
          command -v apksigner
          command -v aapt2
          command -v python3
          command -v jarsigner
          echo "$build_tools" >> "$GITHUB_PATH"

      - name: Bootstrap pinned bundletool validator
        shell: bash
        run: |
          set -euo pipefail
          bundletool_version="1.18.3"
          bundletool_sha256="a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
          bundletool_dir="$RUNNER_TEMP/bundletool"
          bundletool_jar="$bundletool_dir/bundletool-all-$bundletool_version.jar"
          mkdir -p "$bundletool_dir"
          if ! command -v curl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends curl
          fi
          command -v sha256sum
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/google/bundletool/releases/download/$bundletool_version/bundletool-all-$bundletool_version.jar" \
            --output "$bundletool_jar.download"
          printf '%s  %s\n' "$bundletool_sha256" "$bundletool_jar.download" | sha256sum --check --strict
          mv "$bundletool_jar.download" "$bundletool_jar"
          echo "BUNDLETOOL_JAR=$bundletool_jar" >> "$GITHUB_ENV"

      - name: Download both native runtime ABIs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # A failed-job rerun reuses artifacts from the successful attempt.
          # Match the immutable run id and commit while allowing any attempt number.
          pattern: android-release-qemu-runtime-*-${{ github.run_id }}-*-${{ github.sha }}
          path: native/qemu/runtime
          merge-multiple: true

      - name: Validate packaged runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s native/qemu/runtime/arm64-v8a/libopenvm-qemu-aarch64.so
          test -s native/qemu/runtime/arm64-v8a/libopenvm-qemu-x86_64.so
          test -s native/qemu/runtime/x86_64/libopenvm-qemu-aarch64.so
          test -s native/qemu/runtime/x86_64/libopenvm-qemu-x86_64.so
          test -s native/qemu/runtime/arm64-v8a/lib/libz.so.1
          test -s native/qemu/runtime/x86_64/lib/libz.so.1
          test -d native/qemu/runtime/arm64-v8a/share/qemu
          test -d native/qemu/runtime/x86_64/share/qemu

      - name: Build and verify unsigned APK and AAB
        id: release
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          artifact_dir="${RUNNER_TEMP}/android-release-artifacts"
          mkdir -p "$artifact_dir"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

          unsigned_root="$RUNNER_TEMP/openvm-unsigned-build"
          export HOME="$unsigned_root/home"
          export ANDROID_USER_HOME="$unsigned_root/android"
          export GRADLE_USER_HOME="$unsigned_root/gradle"
          mkdir -p "$HOME" "$ANDROID_USER_HOME" "$GRADLE_USER_HOME"

          chmod +x ./gradlew
          ./gradlew --no-daemon --no-scan --stacktrace clean \
            assembleRelease bundleRelease

          mapfile -d '' unsigned_release_apks < <(
            find . -type f -path '*/build/outputs/apk/release/*.apk' \
              -name '*unsigned*.apk' -print0
          )
          if (( ${#unsigned_release_apks[@]} != 0 )); then
            release_apks=("${unsigned_release_apks[@]}")
          else
            mapfile -d '' release_apks < <(
              find . -type f -path '*/build/outputs/apk/release/*.apk' \
                ! -name '*unaligned*.apk' -print0
            )
          fi
          mapfile -d '' release_aabs < <(
            find . -type f -path '*/build/outputs/bundle/release/*.aab' -print0
          )
          if (( ${#release_apks[@]} == 0 )); then
            echo "Gradle completed without producing a release APK." >&2
            exit 1
          fi
          if (( ${#release_aabs[@]} == 0 )); then
            echo "Gradle completed without producing a release AAB." >&2
            exit 1
          fi

          python3 scripts/verify_unsigned_android_artifacts.py \
            --forbid-signing-material-root . \
            --forbid-signing-material-root "$HOME" \
            --forbid-signing-material-root "$ANDROID_USER_HOME" \
            --forbid-signing-material-root "$GRADLE_USER_HOME" \
            app/build/outputs/apk app/build/outputs/bundle

          for apk in "${release_apks[@]}"; do
            unzip -l "$apk" | grep -F 'lib/x86_64/libopenvm-qemu-aarch64.so'
            unzip -l "$apk" | grep -F 'lib/x86_64/libopenvm-qemu-x86_64.so'
            unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopenvm-qemu-aarch64.so'
            unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopenvm-qemu-x86_64.so'
            unzip -l "$apk" | grep -F 'assets/native-qemu/x86_64/lib/libz.so.1'
            unzip -l "$apk" | grep -F 'assets/native-qemu/arm64-v8a/lib/libz.so.1'
            unzip -l "$apk" | grep -F 'assets/native-qemu/x86_64/share/qemu/'
            unzip -l "$apk" | grep -F 'assets/native-qemu/arm64-v8a/share/qemu/'
            zipalign -c -P 16 4 "$apk"
            aapt2 dump badging "$apk" >/dev/null
            set +e
            verifier_output="$(apksigner verify --verbose "$apk" 2>&1)"
            verifier_status=$?
            set -e
            if (( verifier_status == 0 )); then
              echo "Release APK unexpectedly verifies as signed: ${apk#./}" >&2
              exit 1
            fi
            if ! grep -Fq 'DOES NOT VERIFY' <<<"$verifier_output"; then
              echo "apksigner failed for an unexpected reason: ${apk#./}" >&2
              printf '%s\n' "$verifier_output" >&2
              exit 1
            fi
          done
          for aab in "${release_aabs[@]}"; do
            artifact_name="$(basename "$aab")"
            unzip -l "$aab" | grep -F 'base/lib/x86_64/libopenvm-qemu-aarch64.so'
            unzip -l "$aab" | grep -F 'base/lib/x86_64/libopenvm-qemu-x86_64.so'
            unzip -l "$aab" | grep -F 'base/lib/arm64-v8a/libopenvm-qemu-aarch64.so'
            unzip -l "$aab" | grep -F 'base/lib/arm64-v8a/libopenvm-qemu-x86_64.so'
            unzip -l "$aab" | grep -F 'base/assets/native-qemu/x86_64/lib/libz.so.1'
            unzip -l "$aab" | grep -F 'base/assets/native-qemu/arm64-v8a/lib/libz.so.1'
            unzip -l "$aab" | grep -F 'base/assets/native-qemu/x86_64/share/qemu/'
            unzip -l "$aab" | grep -F 'base/assets/native-qemu/arm64-v8a/share/qemu/'
            java -jar "$BUNDLETOOL_JAR" validate --bundle="$aab" \
              > "$artifact_dir/$artifact_name.bundletool-validation.txt"
            set +e
            jarsigner_output="$(jarsigner -verify -strict "$aab" 2>&1)"
            set -e
            if ! grep -Fqi 'jar is unsigned' <<<"$jarsigner_output"; then
              echo "jarsigner did not explicitly identify the AAB as unsigned: ${aab#./}" >&2
              printf '%s\n' "$jarsigner_output" >&2
              exit 1
            fi
          done

          verification_file="$artifact_dir/verification.txt"
          : > "$verification_file"

          for apk in "${release_apks[@]}"; do
            artifact_name="$(basename "$apk")"
            destination="$artifact_dir/$artifact_name"
            if [[ -e "$destination" ]]; then
              echo "Release artifact name collision: $artifact_name" >&2
              exit 1
            fi
            cp -- "$apk" "$destination"
            printf 'Unsigned APK verified: %s\n' "$artifact_name" >> "$verification_file"
          done

          for aab in "${release_aabs[@]}"; do
            artifact_name="$(basename "$aab")"
            destination="$artifact_dir/$artifact_name"
            if [[ -e "$destination" ]]; then
              echo "Release artifact name collision: $artifact_name" >&2
              exit 1
            fi
            cp -- "$aab" "$destination"
            printf 'Unsigned AAB verified: %s\n' "$artifact_name" >> "$verification_file"
          done

          (
            cd "$artifact_dir"
            sha256sum -- *.apk *.aab > SHA256SUMS.txt
          )

      - name: Collect release job context
        id: collect_release
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${{ steps.release.outputs.artifact_dir }}"
          if [[ -z "$artifact_dir" ]]; then
            artifact_dir="$RUNNER_TEMP/android-release-artifacts"
            mkdir -p "$artifact_dir"
          fi
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "run_attempt=${GITHUB_RUN_ATTEMPT}" \
            "commit=${GITHUB_SHA}" \
            "job=${GITHUB_JOB}" \
            "release_step_outcome=${{ steps.release.outcome }}" \
            "runner_os=${RUNNER_OS}" \
            "runner_arch=${RUNNER_ARCH}" \
            "runner_name=${RUNNER_NAME}" \
            > "$artifact_dir/ci-context.txt"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload safe unsigned release evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ steps.collect_release.outputs.artifact_dir }}
          if-no-files-found: warn
          retention-days: 30

  release-not-requested:
    name: Release not requested
    if: github.event_name == 'workflow_dispatch' && inputs.release != true
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the no-op dispatch
        run: echo "No release was requested. Dispatch again with release=true to build unsigned artifacts."
