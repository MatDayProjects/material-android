name: Android Native QEMU

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# This is validation/build work only. A newer commit supersedes an older native build.
concurrency:
  group: android-native-qemu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime:
    name: Build QEMU runtime (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
          - abi: x86_64
    steps:
      - name: Check out OpenVM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Bootstrap native build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils jq
          command -v bash
          command -v curl
          command -v docker
          command -v git
          command -v jq
          command -v readelf
          command -v sha256sum

      - name: Verify the source and patch manifest
        run: bash native/qemu/build-android.sh --verify-only

      - name: Build and collect the Android runtime
        run: |
          set -euo pipefail
          bash native/qemu/build-android.sh \
            --host-abi "${{ matrix.abi }}" \
            --output "${RUNNER_TEMP}/openvm-qemu/${{ matrix.abi }}"
          mkdir -p native/qemu/dist
          cp -a "${RUNNER_TEMP}/openvm-qemu/${{ matrix.abi }}" native/qemu/dist/
          test -s "native/qemu/dist/${{ matrix.abi }}/libopenvm-qemu-aarch64.so"
          test -s "native/qemu/dist/${{ matrix.abi }}/libopenvm-qemu-x86_64.so"
          jq empty "native/qemu/dist/${{ matrix.abi }}/runtime.json"
          jq empty "native/qemu/dist/${{ matrix.abi }}/build-provenance.json"
          jq -e --slurpfile manifest native/qemu/qemu-build.json '
            (.qemuDataBytes | (type == "number" and . <= 67108864)) and
            (.qemuDataFileCount | (type == "number" and . > 0)) and
            (.hasQemuDataDirectory == true) and
            (.qemuDataPolicy == "allowlist") and
            (.qemuDataFiles == $manifest[0].packaging.qemuDataFiles)
          ' "native/qemu/dist/${{ matrix.abi }}/runtime.json"

      - name: Upload runtime and build evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openvm-qemu-runtime-${{ matrix.abi }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: native/qemu/dist
          if-no-files-found: warn
          retention-days: 14

  package-and-smoke-test:
    name: Package APK and smoke-test QEMU on Android
    needs: build-runtime
    if: ${{ needs.build-runtime.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      OPENVM_QEMU_RUNTIME_DIR: ${{ github.workspace }}/native/qemu/runtime
    steps:
      - name: Check out OpenVM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Bootstrap Android build tools
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Put Android build-tools on PATH
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "$sdk_root" ]] || { echo "Android SDK root was not provided by setup-android." >&2; exit 1; }
          build_tools="$sdk_root/build-tools/35.0.0"
          [[ -x "$build_tools/zipalign" ]] || { echo "zipalign is missing from $build_tools" >&2; exit 1; }
          export PATH="$build_tools:$PATH"
          command -v zipalign
          echo "$build_tools" >> "$GITHUB_PATH"

      - name: Download both native runtime ABIs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # A failed-job rerun reuses artifacts from the successful attempt.
          # Match the immutable run id and commit while allowing any attempt number.
          pattern: openvm-qemu-runtime-*-${{ github.run_id }}-*-${{ github.sha }}
          path: native/qemu/runtime
          merge-multiple: true

      - name: Validate downloaded runtime layout
        shell: bash
        run: |
          set -euo pipefail
          find native/qemu/runtime -maxdepth 2 -type f -print
          test -s native/qemu/runtime/arm64-v8a/libopenvm-qemu-aarch64.so
          test -s native/qemu/runtime/arm64-v8a/libopenvm-qemu-x86_64.so
          test -s native/qemu/runtime/x86_64/libopenvm-qemu-aarch64.so
          test -s native/qemu/runtime/x86_64/libopenvm-qemu-x86_64.so
          test -s native/qemu/runtime/arm64-v8a/lib/libz.so.1
          test -s native/qemu/runtime/x86_64/lib/libz.so.1
          test -d native/qemu/runtime/arm64-v8a/share/qemu
          test -d native/qemu/runtime/x86_64/share/qemu
          for abi in arm64-v8a x86_64; do
            jq -e --slurpfile manifest native/qemu/qemu-build.json '
              (.qemuDataBytes | (type == "number" and . <= 67108864)) and
              (.qemuDataFileCount | (type == "number" and . > 0)) and
              (.hasQemuDataDirectory == true) and
              (.qemuDataPolicy == "allowlist") and
              (.qemuDataFiles == $manifest[0].packaging.qemuDataFiles)
            ' "native/qemu/runtime/${abi}/runtime.json"
          done

      - name: Build APK with the generated runtime
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-scan --stacktrace testDebugUnitTest assembleDebug
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -l "$apk" | grep -F 'lib/x86_64/libopenvm-qemu-x86_64.so'
          unzip -l "$apk" | grep -F 'lib/x86_64/libopenvm-qemu-aarch64.so'
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopenvm-qemu-aarch64.so'
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopenvm-qemu-x86_64.so'
          unzip -l "$apk" | grep -F 'assets/native-qemu/x86_64/lib/libz.so.1'
          unzip -l "$apk" | grep -F 'assets/native-qemu/arm64-v8a/lib/libz.so.1'
          unzip -l "$apk" | grep -F 'assets/native-qemu/x86_64/share/qemu/'
          unzip -l "$apk" | grep -F 'assets/native-qemu/arm64-v8a/share/qemu/'
          zipalign -c -P 16 4 "$apk"

      - name: Run the packaged-runtime instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.34.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: >-
            ready=0;
            for attempt in $(seq 1 60); do
              if adb -s emulator-5554 shell cmd package list packages >/dev/null 2>&1; then ready=1; break; fi;
              if [ "$attempt" -eq 60 ]; then echo "Android package service did not become ready after 120 seconds" >&2; exit 1; fi;
              sleep 2;
            done;
            test "$ready" -eq 1;
            ./gradlew --no-daemon --no-scan -PopenvmRequireNativeRuntime=true -Pandroid.testInstrumentationRunnerArguments.class=org.openvm.app.NativeQemuRuntimeSmokeTest connectedDebugAndroidTest;
            ./gradlew --no-daemon --no-scan -PopenvmRequireNativeRuntime=true -Pandroid.testInstrumentationRunnerArguments.class=org.openvm.app.RuntimeAssetStoreTest connectedDebugAndroidTest

      - name: Upload packaged APK and test evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openvm-qemu-apk-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/**/*.xml
            app/build/reports/tests/**/*.html
            app/build/outputs/androidTest-results/**/*.xml
            app/build/reports/androidTests/**/*.html
            app/build/outputs/logs/**
            native/qemu/runtime/**/runtime.json
            native/qemu/runtime/**/build-provenance.json
          if-no-files-found: warn
          retention-days: 14
